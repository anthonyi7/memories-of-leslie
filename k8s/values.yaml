# Only fields that vary between deploys live here.
# Everything else is hardcoded in templates.

image:
  # Never use 'latest'. Set to the git commit SHA of the image you pushed to GHCR.
  tag: a008808

certManager:
  # Name of the cert-manager ClusterIssuer configured in the cluster.
  # Fill this in before first deploy. Check with: kubectl get clusterissuer
  clusterIssuer: dev-ca-issuer

ingress:
  # Hostname for the ingress rule and TLS certificate.
  # Dev: memories.anthony.com  |  Prod: memoriesofleslie.com
  hostname: memories.anthony.com
