# Backup PVC — mounted by the nightly backup CronJob (not by Postgres itself).
# ReadWriteMany so the CronJob pod can be scheduled on any node.
# Uses longhorn-retain StorageClass — reclaimPolicy: Retain is automatic.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backup
  namespace: mol
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
