apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  namespace: mol
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: "postgres:16-alpine"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: memories-postgres-secret
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: memories-postgres-secret
                      key: POSTGRES_USER
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  FILENAME="leslie_$(date +%Y%m%d_%H%M%S).sql.gz"
                  pg_dump -h postgres-service -U "$POSTGRES_USER" leslie \
                    | gzip > "/backups/$FILENAME"
                  echo "Backup written: $FILENAME"
                  find /backups -name "leslie_*.sql.gz" -mtime +30 -delete
                  echo "Pruned backups older than 30 days"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "256Mi"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-backup
